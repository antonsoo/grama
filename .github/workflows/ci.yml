name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:oracle
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/grama-browser-review
      - run: python3 scripts/wav-oracle.py /tmp/grama-browser-review/chromium-1440
      - run: node scripts/offline-failure.mjs /tmp/grama-offline-failure
      - run: npm run verify:family
      - run: npm run test:family -- /tmp/claude-1000/grama-family-browser
      - run: npm run verify:family-audio -- /tmp/claude-1000/grama-family-browser
      - run: npm run test:source-json
      - run: npm run test:listening
      - run: npm run verify:listening-audio
      - run: npm run test:listening-record
      - run: npm run test:listening-save
      - run: npm run test:interactions
      - run: npm run test:attachment
      - run: npm run verify:attachment-audio
      - run: npm run test:record-open
      - run: npm run test:shared-network -- /tmp/claude-1000/grama-shared-bandwidth foreground
      - run: npm run test:startup
